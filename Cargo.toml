[package]
name = "mcstatus-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }